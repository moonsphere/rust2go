[package]
name = "mem-ring"
version = "0.2.0"
description = "Across-thread queue based on shared memory"
authors = ["ihciah <ihciah@gmail.com>"]
categories = ["development-tools::ffi", "external-ffi-bindings"]
edition = "2021"
keywords = ["ffi", "golang", "go", "async"]
license = "MIT/Apache-2.0"
repository = "https://github.com/ihciah/rust2go"

[dependencies]
parking_lot = "0.12"
libc = "0.2"

# Tokio
tokio = { version = "1", features = [
    "rt",
    "sync",
    "net",
    "macros",
    "time",
], default-features = false }
